[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/gcc"
rustflags = ["-C", "link-arg=-fuse-ld=bfd", "-L", "/tmp/alsa_dev/usr/lib/x86_64-linux-gnu"]

[env]
PKG_CONFIG_PATH = "/tmp/alsa_dev/usr/lib/x86_64-linux-gnu/pkgconfig"
LIBCLANG_PATH = "/tmp/libclang_extract/usr/lib/x86_64-linux-gnu"
LD_LIBRARY_PATH = "/tmp/libclang_extract/usr/lib/x86_64-linux-gnu:/tmp/alsa_dev/usr/lib/x86_64-linux-gnu"
LIBRARY_PATH = "/tmp/alsa_dev/usr/lib/x86_64-linux-gnu"
CPATH = "/tmp/alsa_dev/usr/include"
